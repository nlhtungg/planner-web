services:
  mongodb:
    image: mongo:7
    container_name: mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: auth_db
    volumes:
      - ./data/mongo_data:/data/db
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: backend-prod
    restart: unless-stopped
    depends_on:
      - mongodb
      - minio
      - chromadb
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      STRICT_PRODUCTION_ENV: "true"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      CHROMA_URL: http://chromadb:8000
    expose:
      - "3001"
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: minio-prod
    entrypoint:
      - /bin/sh
      - -c
      - 'MINIO_ROOT_USER="$$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$$MINIO_SECRET_KEY" exec minio server /data --console-address ":9001"'
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./data/minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    container_name: minio-init-prod
    restart: on-failure
    depends_on:
      - minio
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - 'until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do echo "Waiting for MinIO..."; sleep 2; done; mc mb -p local/user-media || true; mc mb -p local/workspace-media || true; mc mb -p local/message-media || true; mc mb -p local/chatbot-documents || true; mc anonymous set public local/user-media; mc anonymous set public local/workspace-media; mc anonymous set public local/message-media; mc anonymous set public local/chatbot-documents; echo "MinIO buckets ready";'
    networks:
      - backend

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb-prod
    restart: unless-stopped
    volumes:
      - ./data/chroma_data:/chroma/chroma
    expose:
      - "8000"
    networks:
      - backend

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: nginx-prod
    restart: unless-stopped
    depends_on:
      - backend
      - minio
    ports:
      - "80:80"
    networks:
      - backend

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --web.listen-address=:9100
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs

  # vector:
  #   image: timberio/vector:0.39.0-alpine
  #   container_name: vector-prod
  #   restart: unless-stopped
  #   environment:
  #     PROCFS_ROOT: /host/proc
  #     SYSFS_ROOT: /host/sys
  #   volumes:
  #     - ./deploy/vector/vector.toml:/etc/vector/vector.toml:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /var/log:/host/var/log:ro
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
  #   command:
  #     - --config
  #     - /etc/vector/vector.toml
  #   networks:
  #     - backend

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    user: "0"
    privileged: true
    ports:
      - "12345:12345"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - KAFKA_BROKERS=10.140.0.6:9092
      - KAFKA_TOPIC_CONTAINER_METRICS=container-metrics
      - KAFKA_TOPIC_INSTANCE_METRICS=instance-metrics
      - KAFKA_TOPIC_CONTAINER_LOGS=container-logs
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --stability.level=public-preview
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    networks:
      - backend

networks:
  backend:
    driver: bridge
